[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proteinscope"
version = "0.1.0"
description = "Agent-driven protein structure, binding pocket and ligand analysis with automated reports"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=2.0",
  "biopython>=1.85",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pydantic>=2.5",
  "reportlab>=4.0",
  "requests>=2.31",
  "scipy>=1.11",
]

[project.optional-dependencies]
notebook = ["nglview>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
proteinscope = "proteinscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: test needs access to RCSB"]
